<script>
const KEY='varnoto_store_v1', SUPA_URL='https://xgokhpdhzafuluiqdtah.supabase.co', SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnb2tocGRoemFmdWx1aXFkdGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjU0NDMsImV4cCI6MjEwNDU0MTQ0M30.2B-0GPvxh5KoXVM4jhN06hCt75LakazSC36bh637zQA';
const DEFAULTS=[
 {id:1,cat:'tshirt',en:'Essential White Tee',ar:'تيشيرت أبيض أساسي',price:350,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-tee-white.jpg',imgs:['assets/p-tee-white.jpg']},
 {id:2,cat:'tshirt',en:'Essential Black Tee',ar:'تيشيرت أسود أساسي',price:350,old:450,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-tee-black.jpg',imgs:['assets/p-tee-black.jpg']},
 {id:3,cat:'sweat',en:'Oversized Grey Sweatshirt',ar:'سويت شيرت رمادي أوفرسايز',price:600,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-sweatshirt-grey.jpg',imgs:['assets/p-sweatshirt-grey.jpg']},
 {id:4,cat:'sweat',en:'Lounge Set — Cream',ar:'طقم لاونج — كريمي',price:700,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-lounge-cream.jpg',imgs:['assets/p-lounge-cream.jpg']},
 {id:5,cat:'linen',en:'Summer Striped Shirt',ar:'قميص صيفي مخطط',price:750,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-shirt-summer.jpg',imgs:['assets/p-shirt-summer.jpg']},
 {id:6,cat:'linen',en:'Black Evening Shirt',ar:'قميص أسود أنيق',price:750,old:850,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-shirt-black.jpg',imgs:['assets/p-shirt-black.jpg']},
 {id:7,cat:'jeans',en:'Wide-Leg Jeans — Ice Blue',ar:'جينز وايد ليج — أزرق ثلجي',price:900,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-jeans-ice.jpg',imgs:['assets/p-jeans-ice.jpg']},
 {id:8,cat:'jeans',en:'Wide-Leg Jeans — Raw',ar:'جينز وايد ليج — خام',price:900,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-jeans-raw.jpg',imgs:['assets/p-jeans-raw.jpg']},
 {id:9,cat:'tank',en:'Heavyweight Tank — White',ar:'تانك توب تقيل — أبيض',price:400,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-tank-white.jpg',imgs:['assets/p-tank-white.jpg']},
 {id:10,cat:'tank',en:'Heavyweight Tank — Black',ar:'تانك توب تقيل — أسود',price:400,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-tank-black.jpg',imgs:['assets/p-tank-black.jpg']},
 {id:11,cat:'knit',en:'Two-Tone Knitted Polo',ar:'بولو نيت تو-تون',price:750,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-polo-duo.jpg',imgs:['assets/p-polo-duo.jpg']},
 {id:12,cat:'tailored',en:'Tailored Pants — Beige',ar:'بنطلون كلاسيك — بيج',price:850,old:null,stock:true,qty:20,weight:'',desc_en:'',desc_ar:'',seo_title:'',seo_desc:'',img:'assets/p-pants-beige.jpg',imgs:['assets/p-pants-beige.jpg']}
];
const $=s=>document.querySelector(s);
let L='ar', P=null, Q=1;
const t=(en,ar)=>L==='ar'?ar:en;
function absUrl(r){try{return new URL(r,document.baseURI).href;}catch(e){return r;}}
async function boot(){
 const id=new URLSearchParams(location.search).get('id');
 let store={}; try{store=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
 try{
  const r=await fetch(SUPA_URL+'/rest/v1/store_config?id=eq.1&select=data',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  const j=await r.json(); const d=j&&j[0]&&j[0].data;
  if(d){store=Object.assign({},store,d);try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
 }catch(e){}
 const list=DEFAULTS.map(x=>Object.assign({},x));
 if(Array.isArray(store.products)&&store.products.length){
  const byId={};store.products.forEach(o=>{if(o&&o.id!=null)byId[String(o.id)]=o;});
  list.forEach(p=>{const o=byId[String(p.id)];if(o)Object.assign(p,o);});
  const known=new Set(list.map(p=>String(p.id)));
  store.products.forEach(o=>{if(o&&o.id!=null&&!known.has(String(o.id))){const np=Object.assign({price:0,old:null,stock:true,qty:10,imgs:[]},o);np.imgs=(np.imgs&&np.imgs.length?np.imgs:(np.img?[np.img]:[]));list.push(np);}});
 }
 P=list.find(p=>String(p.id)===String(id))||list[0];
 render(store,list);
}
async function render(store,list){
 const name=t(P.en,P.ar), desc=t(P.desc_ar&&P.desc_ar?P.desc_ar:P.desc_en&&P.desc_en?P.desc_en:'',P.desc_en&&P.desc_en?P.desc_en:P.desc_ar&&P.desc_ar?P.desc_ar:'');
 const seoT=P.seo_title||name+' | VARNOTO', seoD=P.seo_desc||desc||name;
 document.title=seoT;$('#seoDesc').setAttribute('content',seoD);
 $('#seoCanon').setAttribute('content','https://mmetwily1-sudo.github.io/varnoto/product.html?id='+P.id);
 $('#ogTitle').setAttribute('content',seoT);$('#ogDesc').setAttribute('content',seoD);
 if(P.img)$('#ogImg').setAttribute('content',absUrl(P.img));
 const imgs=(P.imgs&&P.imgs.length?P.imgs:(P.img?[P.img]:[]));
 const meta=[];if(P.stock)meta.push(t('متاح: '+P.qty+' قطعة','In stock: '+P.qty));if(P.weight)meta.push(t('الوزن: '+P.weight,'Weight: '+P.weight));
 $('#pwrap').innerHTML=`
  <div><div class="gal-main">${imgs[0]?`<img id="gMain" src="${imgs[0]}" alt="">`:''}</div>
  ${imgs.length>1?`<div class="mthumbs">${imgs.map((u,i)=>`<img src="${u}" class="${i===0?'on':''}" alt="">`).join('')}</div>`:''}</div>
  <div class="pinfo">
   <h1>${name}</h1>
   <div class="price">${P.price} EGP ${P.old?`<span class="old">${P.old} EGP</span>`:''}</div>
   <p class="tiny" style="color:var(--acc);font-weight:700">${meta.join(' • ')}</p>
   <p class="desc">${desc||t('خامة تقيلة صناعة مصرية. مقاسات S–XXL. استبدال 14 يوم ودفع عند الاستلام.','Heavyweight fabric, Egyptian made. Sizes S–XXL. 14-day exchange, COD available.')}</p>
   <div class="sizes"><span>S</span><span>M</span><span>L</span><span>XL</span><span>XXL</span></div>
   <div class="qtyrow"><button id="qm">−</button><b id="qv">1</b><button id="qp">+</button>
   <button class="btn primary" id="pAdd" style="flex:1;background:#141414;border-color:#141414" ${P.stock?'':'disabled'}>${P.stock?t('ضيف للسلة','Add to cart'):t('نفد المخزون','Sold out')}</button></div>
   <a class="link" href="index.html">→ ${t('العودة للمتجر','Back to store')}</a>
  </div>`;
 document.querySelectorAll('.mthumbs img').forEach(th=>th.onclick=()=>{const m=$('#gMain');if(m)m.src=th.src;document.querySelectorAll('.mthumbs img').forEach(x=>x.classList.toggle('on',x===th));});
 $('#qm').onclick=()=>{Q=Math.max(1,Q-1);$('#qv').textContent=Q;};
 $('#qp').onclick=()=>{Q=Math.min(P.qty||99,Q+1);$('#qv').textContent=Q;};
 const ld={'@context':'https://schema.org','@type':'Product',name:P.seo_title||P.en,image:P.img?absUrl(P.img):undefined,description:P.seo_desc||P.desc_en||P.en,brand:{'@type':'Brand',name:'VARNOTO'},offers:{'@type':'Offer',priceCurrency:'EGP',price:P.price,availability:P.stock?'https://schema.org/InStock':'https://schema.org/OutOfStock'}};
  const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);
 try{window.dataLayer=window.dataLayer||[];dataLayer.push({event:'view_item',ecommerce:{currency:'EGP',value:P.price,items:[{item_id:String(P.id),item_name:P.en,price:P.price}]}});}catch(e){}
 $('#pAdd').onclick=()=>{
  let cart=[];try{cart=JSON.parse(localStorage.getItem('varnoto_cart'))||[];}catch(e){}
  const f=cart.find(x=>String(x.id)===String(P.id));
  if(f)f.q+=Q;else cart.push({id:String(P.id),q:Q});
  try{localStorage.setItem('varnoto_cart',JSON.stringify(cart));}catch(e){}
  alert(t('اتضافت للسلة ✅','Added to cart ✅'));
 };
 const rel=list.filter(x=>String(x.id)!==String(P.id)&&String(x.cat)===String(P.cat)).slice(0,4);
 if(rel.length){$('#relSec').style.display='';$('#relGrid').innerHTML=rel.map(x=>`<div class="card"><div class="thumb"><a href="product.html?id=${x.id}">${x.img?`<img src="${x.img}" alt="" loading="lazy">`:''}</a></div><div class="p-body"><b><a href="product.html?id=${x.id}" style="color:inherit;text-decoration:none">${t(x.en,x.ar)}</a></b><div class="price">${x.price} EGP</div></div></div>`).join('');}
 // reviews
 let revs=[];
 try{
  const rr=await fetch(SUPA_URL+'/rest/v1/reviews?product_id=eq.'+P.id+'&approved=eq.true&select=name,rating,comment,created_at&order=created_at.desc',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  revs=await rr.json();
 }catch(e){revs=[];}
 const avg=revs.length?(revs.reduce((a,r)=>a+Number(r.rating||0),0)/revs.length):0;
 const stars=n=>'★★★★★'.slice(0,Math.round(n))+'☆☆☆☆☆'.slice(0,5-Math.round(n));
 if(avg>0){
  const ld2={'@context':'https://schema.org','@type':'Product',name:P.seo_title||P.en,aggregateRating:{'@type':'AggregateRating',ratingValue:avg.toFixed(1),reviewCount:revs.length}};
  const s2=document.createElement('script');s2.type='application/ld+json';s2.textContent=JSON.stringify(ld2);document.head.appendChild(s2);
 }
 const sec=document.createElement('section');sec.className='section';sec.id='revSec';
 sec.innerHTML=`<div class="container"><h2>${t('آراء العملاء','Customer reviews')} ${avg>0?`<span style="color:var(--acc)">${stars(avg)} ${avg.toFixed(1)} (${revs.length})</span>`:''}</h2>
 <div id="revList" style="display:grid;gap:10px;margin:14px 0">${revs.length?revs.map(r=>`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px"><b>${r.name||t('عميل','Customer')}</b> <span style="color:var(--acc)">${stars(Number(r.rating))}</span><p class="tiny" style="margin-top:6px">${r.comment||''}</p></div>`).join(''):`<p class="tiny">${t('كن أول من يقيّم هذا المنتج','Be the first to review this product')}</p>`}</div>
 <h3>${t('قيّم المنتج','Write a review')}</h3>
 <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
 <input id="rvName" placeholder="${t('اسمك','Your name')}" style="padding:11px;border:1px solid var(--line);border-radius:10px;font-family:inherit">
 <select id="rvRate" style="padding:11px;border:1px solid var(--line);border-radius:10px;font-family:inherit"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div>
 <textarea id="rvCmt" placeholder="${t('رأيك في المنتج...','Your review...')}" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-family:inherit;margin-top:10px;min-height:80px"></textarea>
 <button class="btn primary" id="rvSend" style="background:#141414;border-color:#141414;margin-top:10px">${t('إرسال التقييم','Submit review')}</button>
 <p class="tiny" id="rvMsg"></p></div>`;
 document.querySelector('footer').before(sec);
 $('#rvSend').onclick=async()=>{
  const nm=$('#rvName').value.trim(),cm=$('#rvCmt').value.trim(),rt=Number($('#rvRate').value);
  if(!cm){$('#rvMsg').textContent=t('اكتب رأيك الأول','Write your review first');return;}
  try{
   const r=await fetch(SUPA_URL+'/rest/v1/reviews',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({product_id:String(P.id),name:nm||null,rating:rt,comment:cm,approved:false})});
   $('#rvMsg').textContent=r.ok?t('✅ شكراً! تقييمك هيظهر بعد المراجعة','✅ Thanks! Your review will appear after moderation'):t('تعذر الإرسال','Could not submit');
   if(r.ok){$('#rvCmt').value='';}
  }catch(e){$('#rvMsg').textContent=t('تعذر الإرسال','Could not submit');}
 };
}
$('#langBtn').onclick=()=>{L=L==='ar'?'en':'ar';document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('#langBtn').textContent=L==='ar'?'EN':'عربي';boot();};
boot();
